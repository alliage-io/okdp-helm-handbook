{{- if .Values.bundle.enabled }}
{{- if .Capabilities.APIVersions.Has "trust.cert-manager.io/v1alpha1" }}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ .Values.bundle.name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  sources:
    - useDefaultCAs: true
  target:
    {{- if .Values.bundle.target.configMap.enabled }}
    configMap:
      key: {{ .Values.bundle.target.configMap.key | quote }}
    {{- end }}
    {{- if .Values.bundle.target.secret.enabled }}
    secret:
      key: {{ .Values.bundle.target.secret.key | quote }}
    {{- end }}
    additionalFormats:
      pkcs12:
        key: "bundle.p12"
{{- end }}
{{- end }}
