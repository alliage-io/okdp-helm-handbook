cert-manager:
  installCRDs: false
  enableCertificateOwnerRef: true
  global:
    namespace: "okdp-prerequisites"
  webhook:
    extraArgs:
      - "--dynamic-serving-leaf-duration=2160h"

issuers:
  enabled: true
  caClusterIssuers: []
  selfSignedClusterIssuers:
    - name: "default-issuer"
      certificate:
        commonName: "OKDP Sandbox Self-Signed CA"
        organization: "OKDP"
        country: "FR"
        validity: "8760h"
        algorithm: "ECDSA"
        size: 256
