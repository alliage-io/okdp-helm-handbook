{{- if and .Values.issuers.enabled .Values.issuers.selfSignedClusterIssuers }}
{{- if .Capabilities.APIVersions.Has "cert-manager.io/v1" }}
{{- range .Values.issuers.selfSignedClusterIssuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}-self
  labels:
    cert-issuers.okdp.io/type: "self-signed-bootstrap"
    cert-issuers.okdp.io/issuer-name: {{ .name | quote }}
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: default
  labels:
    cert-issuers.okdp.io/type: "ca-certificate"
    cert-issuers.okdp.io/issuer-name: {{ .name | quote }}
spec:
  isCA: true
  commonName: {{ .certificate.commonName | quote }}
  subject:
    organizations:
      - {{ .certificate.organization | quote }}
    countries:
      - {{ .certificate.country | quote }}
  secretName: {{ .name }}
  duration: {{ .certificate.validity }}
  renewBefore: "720h"
  privateKey:
    algorithm: {{ .certificate.algorithm }}
    size: {{ .certificate.size }}
  issuerRef:
    name: {{ .name }}-self
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
  labels:
    cert-issuers.okdp.io/type: "ca"
    cert-issuers.okdp.io/issuer-name: {{ .name | quote }}
  annotations:
    cert-issuers.okdp.io/depends-on: {{ .name }}-self
spec:
  ca:
    secretName: {{ .name }}

{{- end }}
{{- end }}
{{- end }}
